[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
# Arc's own contracts are built at 0.8.29, so match it rather than drifting ahead.
evm_version = "cancun"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
arc_testnet = { url = "https://testnet.arcscan.app/api", chain = 5042002, key = "unset" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
